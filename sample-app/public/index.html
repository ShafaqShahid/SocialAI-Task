<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MiniSociali</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --danger: #f87171;
      }
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 2rem;
      }
      h1, h2 { margin-top: 0; }
      .container { max-width: 720px; margin: 0 auto; }
      .card {
        background: var(--card);
        border-radius: 12px;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
      }
      label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.25rem; }
      input, textarea, select, button {
        width: 100%;
        padding: 0.6rem 0.75rem;
        border-radius: 8px;
        border: 1px solid #334155;
        background: #0f172a;
        color: var(--text);
        font-size: 0.95rem;
        margin-bottom: 0.9rem;
        font-family: inherit;
      }
      button {
        background: var(--accent);
        color: #0f172a;
        border: none;
        cursor: pointer;
        font-weight: 600;
      }
      button:hover { filter: brightness(1.1); }
      button.secondary { background: transparent; color: var(--muted); border: 1px solid #334155; }
      .error { color: var(--danger); font-size: 0.85rem; min-height: 1.1rem; }
      .post {
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 0.9rem 1rem;
        margin-bottom: 0.75rem;
      }
      .post h3 { margin: 0 0 0.25rem; font-size: 1rem; }
      .post small { color: var(--muted); }
      .row { display: flex; gap: 0.75rem; }
      .row > * { flex: 1; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>MiniSociali</h1>

      <!-- Login / Register -->
      <section id="auth-card" class="card" data-testid="auth-card">
        <h2 id="auth-title">Log in</h2>
        <label for="email">Email</label>
        <input id="email" type="email" data-testid="email-input" />
        <label for="password">Password</label>
        <input id="password" type="password" data-testid="password-input" />
        <div class="row">
          <button id="login-btn" data-testid="login-btn">Log in</button>
          <button id="register-btn" class="secondary" data-testid="register-btn">Register</button>
        </div>
        <div id="auth-error" class="error" data-testid="auth-error"></div>
      </section>

      <!-- Dashboard -->
      <section id="dashboard" class="card" hidden data-testid="dashboard">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h2>Your Posts</h2>
          <button id="logout-btn" class="secondary" style="width:auto;" data-testid="logout-btn">Log out</button>
        </div>

        <form id="create-form" data-testid="create-form">
          <label for="title">Title</label>
          <input id="title" data-testid="title-input" />
          <label for="content">Content</label>
          <textarea id="content" rows="3" data-testid="content-input"></textarea>
          <label for="platform">Platform</label>
          <select id="platform" data-testid="platform-select">
            <option value="facebook">Facebook</option>
            <option value="instagram">Instagram</option>
            <option value="linkedin">LinkedIn</option>
            <option value="threads">Threads</option>
          </select>
          <button type="submit" data-testid="create-btn">Create post</button>
          <div id="create-error" class="error" data-testid="create-error"></div>
        </form>

        <div id="posts-list" data-testid="posts-list"></div>
      </section>
    </div>

    <script>
      const state = { token: null };

      const $ = (sel) => document.querySelector(sel);

      async function api(path, options = {}) {
        const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
        if (state.token) headers['Authorization'] = `Bearer ${state.token}`;
        const res = await fetch(path, { ...options, headers });
        const body = res.status === 204 ? null : await res.json().catch(() => null);
        return { status: res.status, body };
      }

      function showAuthError(msg) { $('#auth-error').textContent = msg || ''; }
      function showCreateError(msg) { $('#create-error').textContent = msg || ''; }

      async function login() {
        showAuthError('');
        const { status, body } = await api('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email: $('#email').value, password: $('#password').value }),
        });
        if (status !== 200) return showAuthError(body?.error || 'Login failed');
        state.token = body.token;
        enterDashboard();
      }

      async function register() {
        showAuthError('');
        const { status, body } = await api('/api/auth/register', {
          method: 'POST',
          body: JSON.stringify({ email: $('#email').value, password: $('#password').value }),
        });
        if (status !== 201) return showAuthError(body?.error || 'Registration failed');
        state.token = body.token;
        enterDashboard();
      }

      async function enterDashboard() {
        $('#auth-card').hidden = true;
        $('#dashboard').hidden = false;
        await refreshPosts();
      }

      function logout() {
        state.token = null;
        $('#dashboard').hidden = true;
        $('#auth-card').hidden = false;
      }

      async function refreshPosts() {
        const { body } = await api('/api/posts');
        const list = $('#posts-list');
        list.innerHTML = '';
        for (const post of body?.posts || []) {
          const el = document.createElement('div');
          el.className = 'post';
          el.dataset.testid = 'post-item';
          el.innerHTML = `
            <h3>${escapeHtml(post.title)}</h3>
            <small>${escapeHtml(post.platform)} · ${new Date(post.createdAt).toLocaleString()}</small>
            <p style="margin:0.5rem 0 0;">${escapeHtml(post.content)}</p>
          `;
          list.appendChild(el);
        }
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      async function createPost(e) {
        e.preventDefault();
        showCreateError('');
        const payload = {
          title: $('#title').value,
          content: $('#content').value,
          platform: $('#platform').value,
        };
        const { status, body } = await api('/api/posts', {
          method: 'POST',
          body: JSON.stringify(payload),
        });
        if (status !== 201) return showCreateError(body?.error || 'Create failed');
        // BUG (seeded, UI): form is not reset after successful create.
        await refreshPosts();
      }

      $('#login-btn').addEventListener('click', login);
      $('#register-btn').addEventListener('click', register);
      $('#logout-btn').addEventListener('click', logout);
      $('#create-form').addEventListener('submit', createPost);
    </script>
  </body>
</html>
